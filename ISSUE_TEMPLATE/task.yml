name: Task
description: A unit of work for a FAE agent or the board
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this matters, which goal it serves (e.g. G1)
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: refs
    attributes:
      label: References
      description: ADRs, docs, related issues
