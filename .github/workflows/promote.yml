# Reusable promotions and back-merges for every By Fae repo (byfae-dev/project-fae#208). Standard:
# brain/30-knowledge/engineering/git-workflow.md → Merging. Callers run it on every push to dev,
# staging and main: it opens the PR that push calls for, waits for its required checks and, when
# every one passed, merges it as the byfae-release app — a ruleset bypass actor (pull requests
# only), which takes it past the required review (board decision 2026-10-09). Red checks or a
# conflict leave the PR open for the board. staging → main is kept open for the board, never
# merged here; releases stay the board's.
name: promote

on:
  workflow_call:

permissions: {}

jobs:
  promote:
    name: promote or back-merge
    runs-on: ubuntu-latest
    timeout-minutes: 25 # the wait for the PR's checks is capped at 20
    permissions:
      contents: read # the checkout; everything that writes uses the release app's token
    # One at a time per pushed branch: a second push waits instead of opening a second PR.
    concurrency:
      group: promote-${{ github.repository }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every branch, with history: the decision compares them
          persist-credentials: false
      - name: Decide what to merge
        id: plan
        env:
          PUSHED: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # $2 has changes that $1 lacks: their contents differ, and $2 changed since they split.
          # Equal contents (the squash back into dev, a promotion just merged) need nothing.
          ahead() {
            ! git diff --quiet "origin/$1" "origin/$2" &&
              ! git diff --quiet "$(git merge-base "origin/$1" "origin/$2")" "origin/$2"
          }
          plan() {
            local head=$1 base=$2 method=$3 kind=$4 since version
            since=$(git merge-base "origin/$base" "origin/$head")
            version=$(git show "origin/$head:version.txt" 2>/dev/null || true)
            title="chore: $kind"
            if [ "$kind" != "promote dev to staging" ] && [ -n "$version" ]; then
              title="$title after v$version"
            fi
            ci=false
            if git diff --name-only "$since" "origin/$head" | grep -q '^\.github/workflows/'; then
              ci=true
            fi
            {
              echo "head=$head"; echo "base=$base"; echo "method=$method"
              echo "title=$title"; echo "ci=$ci"
            } >> "$GITHUB_OUTPUT"
            {
              if [ "$ci" = true ]; then
                echo "Automatic \`$head → $base\`. **Changes CI** (\`.github/workflows/\`), which the release app may not merge: **the board merges it**, with a ${method/merge/merge commit}."
              else
                echo "Automatic \`$head → $base\`: merges itself with a ${method/merge/merge commit} once its required checks pass (git-workflow → Merging). Red checks leave it open for the board."
              fi
              echo
              echo "Included:"
              git log --no-merges --format='- %s' "$since..origin/$head"
            } > "$RUNNER_TEMP/body.md"
          }
          case "$PUSHED" in
            dev) if ahead staging dev; then plan dev staging merge "promote dev to staging"; fi ;;
            main) if ahead staging main; then plan main staging merge "back-merge main into staging"; fi ;;
            staging) if ahead dev staging; then plan staging dev squash "back-merge staging into dev"; fi ;;
          esac
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        if: steps.plan.outputs.head != '' || github.ref_name == 'staging'
        id: app-token
        with:
          client-id: ${{ vars.BYFAE_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.BYFAE_RELEASE_KEY }}
      - name: Open the PR and merge it when green
        if: steps.plan.outputs.head != ''
        env:
          POLL_SECONDS: 20
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD: ${{ steps.plan.outputs.head }}
          BASE: ${{ steps.plan.outputs.base }}
          METHOD: ${{ steps.plan.outputs.method }}
          TITLE: ${{ steps.plan.outputs.title }}
          CI: ${{ steps.plan.outputs.ci }}
        run: |
          set -euo pipefail
          repo=(--repo "$GITHUB_REPOSITORY")
          pr=$(gh pr list "${repo[@]}" --head "$HEAD" --base "$BASE" --state open --json number -q '.[0].number')
          if [ -z "$pr" ]; then
            url=$(gh pr create "${repo[@]}" --head "$HEAD" --base "$BASE" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md")
            pr=${url##*/}
          else
            gh pr edit "$pr" "${repo[@]}" --body-file "$RUNNER_TEMP/body.md" >/dev/null
          fi
          if [ "$CI" = true ]; then
            echo "::notice::#$pr changes .github/workflows/ — left for the board"
            exit 0
          fi
          # Merge only the commit whose required checks all passed; a push meanwhile starts over.
          for _ in $(seq $((1200 / (POLL_SECONDS > 0 ? POLL_SECONDS : 1)))); do
            read -r sha mergeable < <(gh pr view "$pr" "${repo[@]}" --json headRefOid,mergeable -q '"\(.headRefOid) \(.mergeable)"')
            if [ "$mergeable" = CONFLICTING ]; then
              {
                cat "$RUNNER_TEMP/body.md"
                echo
                echo "**Conflicts with \`$BASE\`** — left for the board. Resolve it on a \`fae/\` branch from \`dev\` that merges \`$BASE\` in, as a work PR into \`dev\`; this PR then goes on by itself."
              } > "$RUNNER_TEMP/conflict.md"
              gh pr edit "$pr" "${repo[@]}" --body-file "$RUNNER_TEMP/conflict.md" >/dev/null
              echo "::notice::#$pr conflicts with $BASE — left for the board"
              exit 0
            fi
            buckets=$(gh pr checks "$pr" "${repo[@]}" --required --json bucket -q '[.[].bucket] | join(" ")' 2>"$RUNNER_TEMP/checks.err") || true
            # Not yet reported is a wait; anything else GitHub refuses (a missing permission) fails
            # the run where the board sees it, instead of waiting it out.
            if [ -s "$RUNNER_TEMP/checks.err" ] && ! grep -q 'no .*checks reported' "$RUNNER_TEMP/checks.err"; then
              echo "::error::can't read #$pr's checks: $(head -c 500 "$RUNNER_TEMP/checks.err")"
              exit 1
            fi
            case " $buckets " in
              *" fail "* | *" cancel "*)
                echo "::notice::#$pr has failing required checks — left for the board"
                exit 0 ;;
            esac
            if [ -n "$buckets" ] && [[ " $buckets " != *" pending "* ]] &&
              [ "$sha" = "$(gh pr view "$pr" "${repo[@]}" --json headRefOid -q .headRefOid)" ]; then
              gh pr merge "$pr" "${repo[@]}" --admin "--$METHOD" --match-head-commit "$sha"
              echo "::notice::#$pr merged with --$METHOD"
              exit 0
            fi
            sleep "$POLL_SECONDS"
          done
          echo "::notice::#$pr's required checks still run after 20 minutes — left for the board"
      - name: Keep staging → main open for the board
        if: github.ref_name == 'staging'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # Only when staging has changes main lacks; the board merges it when main should move on.
          since=$(git merge-base origin/main origin/staging)
          if git diff --quiet origin/main origin/staging || git diff --quiet "$since" origin/staging; then
            exit 0
          fi
          {
            echo "Promotion \`staging → main\`, for the board: **merge with a merge commit** when \`main\` should move on. Kept up to date by \`promote.yml\`; never merged by it."
            echo
            echo "Included:"
            git log --no-merges --format='- %s' "$since..origin/staging"
          } > "$RUNNER_TEMP/main.md"
          repo=(--repo "$GITHUB_REPOSITORY")
          pr=$(gh pr list "${repo[@]}" --head staging --base main --state open --json number -q '.[0].number')
          if [ -z "$pr" ]; then
            gh pr create "${repo[@]}" --head staging --base main --title "chore: promote staging to main" --body-file "$RUNNER_TEMP/main.md"
          else
            gh pr edit "$pr" "${repo[@]}" --body-file "$RUNNER_TEMP/main.md" >/dev/null
            echo "::notice::#$pr is up to date for the board"
          fi
