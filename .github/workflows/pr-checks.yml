# Reusable PR checks for every By Fae repo. Standard: brain/30-knowledge/engineering/git-workflow.md
name: pr-checks

on:
  workflow_call:
    inputs:
      scopes:
        description: Comma-separated allowed commit scopes; empty allows any scope
        type: string
        default: ""

permissions: {}

jobs:
  title:
    name: conventional title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Lint PR title with commitlint
        env:
          # Passed via env, never interpolated into the script: PR titles are untrusted input.
          TITLE: ${{ github.event.pull_request.title }}
          SCOPES: ${{ inputs.scopes }}
        run: |
          cat > commitlint.config.mjs <<'JS'
          const scopes = (process.env.SCOPES || "").split(",").map((s) => s.trim()).filter(Boolean);
          export default {
            extends: ["@commitlint/config-conventional"],
            rules: {
              "header-max-length": [2, "always", 72],
              "type-enum": [2, "always",
                ["feat", "fix", "refactor", "perf", "test", "docs", "build", "ci", "chore", "revert"]],
              ...(scopes.length ? { "scope-enum": [2, "always", scopes] } : {}),
            },
          };
          JS
          bun add --silent @commitlint/cli@21 @commitlint/config-conventional@21
          printf '%s\n' "$TITLE" | bunx --bun commitlint --verbose

  flow:
    name: branch flow
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check source → target branch and linked issue
        env:
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          ok() { echo "✓ $HEAD → $BASE"; exit 0; }
          case "$BASE" in
            dev)     case "$HEAD" in fae/*|dependabot/*|staging) ;; *) bad=1 ;; esac ;;
            staging) case "$HEAD" in dev|main) ;; *) bad=1 ;; esac ;;
            main)    case "$HEAD" in staging|hotfix/*|release-please--*) ;; *) bad=1 ;; esac ;;
            *)       ok ;;  # stacked PRs onto feature branches are fine
          esac
          if [ -n "${bad:-}" ]; then
            echo "::error::$HEAD → $BASE is not allowed. Flow: fae/* and dependabot/* → dev → staging → main; hotfix/* → main; back-merges main → staging → dev."
            exit 1
          fi
          case "$HEAD" in
            fae/*|hotfix/*)
              if ! printf '%s' "$BODY" | grep -qiE '(close[sd]?|fix(e[sd])?|resolve[sd]?|refs?:?) +([a-z0-9_.-]+/[a-z0-9_.-]+)?#[0-9]+'; then
                echo "::error::Work PRs must link their issue in the body: 'Closes #N', or 'Refs #N' when another PR closes it."
                exit 1
              fi ;;
          esac
          ok
