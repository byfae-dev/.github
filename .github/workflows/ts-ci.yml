# Reusable TypeScript CI on Bun (ADR-0019 in project-fae).
# Standard: brain/30-knowledge/engineering/{code-style,testing}.md
name: ts-ci

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: "."
      diff-coverage:
        description: Minimum coverage (%) of changed lines on pull requests
        type: number
        default: 80

permissions:
  contents: read

jobs:
  ts:
    name: lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # diff-cover compares against the base branch
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ${{ inputs.working-directory }}/package.json  # "packageManager": "bun@x.y.z"
      - run: bun install --frozen-lockfile
      - name: biome
        run: bun run check
      - name: tsc
        run: bun run typecheck
      - name: knip
        run: bun run knip
      - name: test
        run: bun run coverage
      - name: diff coverage
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
          MIN: ${{ inputs.diff-coverage }}
          WD: ${{ inputs.working-directory }}
        # bun writes lcov paths relative to the project (src/x.ts); git diffs from the repo root
        # (web/src/x.ts). Without the prefix nothing matches and diff-cover silently passes.
        run: |
          prefix="${WD#./}"; [ "$prefix" = "." ] && prefix=""
          sed "s#^SF:#SF:${prefix:+$prefix/}#" coverage/lcov.info > coverage/lcov.repo.info
          pipx run diff-cover coverage/lcov.repo.info --compare-branch="origin/$BASE" --fail-under="$MIN"
      - name: build
        run: bun run build
