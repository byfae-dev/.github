# Reusable Python CI. Standard: brain/30-knowledge/engineering/{code-style,testing}.md
name: python-ci

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        default: "."
      diff-coverage:
        description: Minimum coverage (%) of changed lines on pull requests
        type: number
        default: 80

permissions:
  contents: read

jobs:
  python:
    name: lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # diff-cover compares against the base branch
      - uses: astral-sh/setup-uv@v10
        with:
          working-directory: ${{ inputs.working-directory }}
          enable-cache: true
      - run: uv sync --locked
      - name: ruff format
        run: uv run ruff format --check .
      - name: ruff lint
        run: uv run ruff check .
      - name: pyright
        run: uv run pyright
      - name: vulture
        run: uv run vulture
      - name: pytest
        run: uv run pytest
      - name: diff coverage
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
          MIN: ${{ inputs.diff-coverage }}
        run: uv run diff-cover coverage.xml --compare-branch="origin/$BASE" --fail-under="$MIN"
